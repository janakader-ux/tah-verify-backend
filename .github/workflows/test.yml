name: E2E Regression Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx

      - name: Run Local E2E Test Suite
        run: |
          python scripts/tests/test_e2e_local.py
          python test_pricing.py
          python scripts/tests/test_workflow.py
          python scripts/tests/test_document_review.py
          python scripts/tests/test_launch_matrix.py
          python scripts/tests/test_trustid_callback.py
          python scripts/tests/test_provider_journeys.py
          python scripts/build_qa_preview.py
          python scripts/tests/test_static.py
          node --check public/js/apply.js
          node --test scripts/tests/test_frontend.cjs
